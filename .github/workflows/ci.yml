name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      # Placed after the two tools whose reported scope it floors, so a run that examined a
      # fraction of the repository and exited 0 fails here instead of passing silently.
      - run: npm run gate:scope
      # Needs neither a server nor a build, so it runs before the build is paid for.
      - run: npm run gate:routes
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Same secrets as the build step, so the exact-value half of the scan has concrete strings
      # to look for rather than falling back to the shape and identifier checks alone.
      - run: npm run gate:build-output
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    # Deliberately narrower than the `ci` job above. `on.push.branches` is `**` so
    # the cheap job — and the gate-integrity check that will live in it — observes
    # every branch; a gate confined to `master` would never have run against
    # `origin/feature/notes-dashboard`. This job starts a full Supabase stack, so it
    # stays on `master` and PRs into it. The asymmetry is intended; do not "fix" it.
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.117.0
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      # Position is load-bearing: the database is migrated and holds zero rows
      # only here. After the smoke walk below it holds whatever that walk left
      # behind — scripts/smoke.mjs performs no cleanup.
      - name: Run database policy tests
        run: supabase test db
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      # The local stack's real URL and anon key live in supabase.env here, not in the step
      # environment, so they are exported for the exact-value half of the scan.
      - name: Scan build output for secrets
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_KEY="$ANON_KEY" npm run gate:build-output
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          # The loop exits 0 whether or not the server ever answered, so without this branch an
          # unreachable preview is caught only by whatever the smoke walk fails on downstream.
          curl -sf -o /dev/null http://localhost:4321/ || {
            echo "preview server did not answer on http://localhost:4321/ within 60s"
            exit 1
          }
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup
