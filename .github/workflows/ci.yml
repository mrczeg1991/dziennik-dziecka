name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  # Drift is bidirectional and a merge trigger samples at the wrong times: the hosted-project link
  # lives in the gitignored supabase/.temp/, so a laptop `supabase db push` can advance the hosted
  # database with no merge involved. Off-the-hour to avoid GitHub's scheduling peak.
  schedule:
    - cron: "23 5 * * *"

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      # Unit only: the integration suite needs a migrated database, which this job has no part of.
      # It runs in the `smoke` job below.
      - run: npm run test:unit
      # Placed after the three tools whose reported scope it floors, so a run that examined a
      # fraction of the repository -- or a suite that ran a fraction of its tests -- and exited 0
      # fails here instead of passing silently.
      - run: npm run gate:scope
      # Needs neither a server nor a build, so it runs before the build is paid for.
      - run: npm run gate:routes
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Same secrets as the build step, so the exact-value half of the scan has concrete strings
      # to look for rather than falling back to the shape and identifier checks alone.
      - run: npm run gate:build-output
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    # Deliberately narrower than the `ci` job above. `on.push.branches` is `**` so
    # the cheap job — and the gate-integrity check that will live in it — observes
    # every branch; a gate confined to `master` would never have run against
    # `origin/feature/notes-dashboard`. This job starts a full Supabase stack, so it
    # stays on `master` and PRs into it. The asymmetry is intended; do not "fix" it.
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.117.0
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > supabase.env
      # Position is load-bearing, and two steps now depend on it: the database
      # is migrated and holds zero rows only here. After the smoke walk below it
      # holds whatever that walk left behind — scripts/smoke.mjs performs no
      # cleanup. The policy tests roll each file back, and the integration suite
      # seeds and deletes by a reserved id prefix, so neither strictly requires
      # an empty database; both sit here anyway so that a failure is about the
      # code under test and not about residue, and so neither is skipped when a
      # later step fails. Do not move either below the walk.
      - name: Run database policy tests
        run: supabase test db
      # The only job with a migrated database, so the only place this suite can
      # run. tests/integration/fixtures.ts requires all three names and throws
      # (never skips) if one is absent; `supabase status -o env` emits them under
      # different names, hence the mapping.
      - name: Run integration tests
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            npm run test:int
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      # The local stack's real URL and anon key live in supabase.env here, not in the step
      # environment, so they are exported for the exact-value half of the scan.
      - name: Scan build output for secrets
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_KEY="$ANON_KEY" npm run gate:build-output
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          # The loop exits 0 whether or not the server ever answered, so without this branch an
          # unreachable preview is caught only by whatever the smoke walk fails on downstream.
          curl -sf -o /dev/null http://localhost:4321/ || {
            echo "preview server did not answer on http://localhost:4321/ within 60s"
            exit 1
          }
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup

  # Deliberately NOT a step in the `ci` job: this one talks to the hosted project, so running it on
  # every branch push would need credentials everywhere and hammer the project. The blocking copy of
  # this check is the one inside `npm run gates`, which Cloudflare's build command calls. This job is
  # the scheduled sweep, and it is advisory.
  #
  # Needs neither Docker nor the local stack, so it checks out, installs and runs -- no
  # `supabase start`. The CLI comes from the `supabase` devDependency, version-pinned by
  # package-lock.json.
  drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gate:drift
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # `supabase migration list` against a hosted project needs a logged-in CLI on top of the
          # ref and the password: without it the CLI answers LegacyPlatformAuthRequiredError, which
          # this gate reports as an unparseable verdict rather than as "no drift". The gate's own
          # credential precheck names it now, so an absent secret fails on the first line.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
